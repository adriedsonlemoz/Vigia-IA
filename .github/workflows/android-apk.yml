name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar assinatura release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 ausente" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS ausente" >&2; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/vigiaia-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "Keystore reconstruida esta vazia" >&2; exit 1; }
          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Ler versão do aplicativo
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "full_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache dos modelos de IA
        uses: actions/cache@v4
        with:
          path: assets/models/*.tflite
          key: vigiaia-models-v1

      - name: Recriar Android com template atual
        run: bash ./tool/bootstrap_android.sh

      - name: Baixar modelo TensorFlow Lite
        run: bash ./tool/fetch_model.sh

      - name: Dependencias
        run: flutter pub get

      - name: Verificacao preventiva
        run: bash ./tool/verify_project.sh

      - name: Analise estatica
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded --coverage

      - name: Salvar cobertura de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build APKs release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PATH" || { echo "ANDROID_KEYSTORE_PATH ausente" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Secret ANDROID_KEY_PASSWORD ausente" >&2; exit 1; }
          # APK universal para instalação manual e APKs menores para cada ABI.
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Nomear APKs e analisar tamanho
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.full_version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          RELEASE_DIR="build/release"
          mkdir -p "$RELEASE_DIR"
          declare -A APKS=(
            [app-release.apk]="VigiaIA-v${APP_VERSION}-universal.apk"
            [app-arm64-v8a-release.apk]="VigiaIA-v${APP_VERSION}-arm64-v8a.apk"
            [app-armeabi-v7a-release.apk]="VigiaIA-v${APP_VERSION}-armeabi-v7a.apk"
            [app-x86_64-release.apk]="VigiaIA-v${APP_VERSION}-x86_64.apk"
          )
          for source_name in "${!APKS[@]}"; do
            source_apk="build/app/outputs/flutter-apk/$source_name"
            test -s "$source_apk" || { echo "APK release nao encontrada: $source_name" >&2; exit 1; }
            cp "$source_apk" "$RELEASE_DIR/${APKS[$source_name]}"
          done
          python3 - "$RELEASE_DIR" "$RELEASE_DIR/apk-size-report.txt" <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import sys, zipfile

          release_dir = Path(sys.argv[1])
          report = Path(sys.argv[2])
          lines = []
          for apk in sorted(release_dir.glob('*.apk')):
              groups = defaultdict(int)
              largest = []
              with zipfile.ZipFile(apk) as archive:
                  for item in archive.infolist():
                      top = item.filename.split('/', 1)[0]
                      groups[top] += item.compress_size
                      largest.append((item.compress_size, item.file_size, item.filename))
              lines.extend([
                  f'APK: {apk.name}',
                  f'Tamanho final: {apk.stat().st_size} bytes',
                  '',
                  'Tamanho comprimido por diretório:',
              ])
              for name, size in sorted(groups.items(), key=lambda pair: pair[1], reverse=True):
                  lines.append(f'{size:>12}  {name}')
              lines.extend(['', '30 maiores arquivos internos (comprimido / original):'])
              for compressed, original, name in sorted(largest, reverse=True)[:30]:
                  lines.append(f'{compressed:>12} / {original:>12}  {name}')
              lines.extend(['', '=' * 72, ''])
          report.write_text('\n'.join(lines) + '\n')
          PY
          flutter pub deps --style=compact > "$RELEASE_DIR/flutter-dependencies.txt"
          (cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath) > "$ROOT_DIR/$RELEASE_DIR/gradle-release-dependencies.txt"
          cat "$RELEASE_DIR/apk-size-report.txt"

      - name: Verificar assinatura dos APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner" || { echo "apksigner nao encontrado" >&2; exit 1; }
          for apk in build/release/*.apk; do
            test -s "$apk" || { echo "APK release nao encontrada" >&2; exit 1; }
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Publicar APKs na Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.meta.outputs.full_version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/*.apk --clobber
          else
            gh release create "$TAG" build/release/*.apk \
              --title "Vigia IA v${APP_VERSION}" \
              --generate-notes
          fi

      - name: Arquivar relatórios técnicos
        uses: actions/upload-artifact@v4
        with:
          name: VigiaIA-v${{ steps.meta.outputs.full_version }}-relatorios
          path: |
            build/release/apk-size-report.txt
            build/release/flutter-dependencies.txt
            build/release/gradle-release-dependencies.txt
          compression-level: 0
          if-no-files-found: error
