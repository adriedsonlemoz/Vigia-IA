name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Recriar Android com template atual
        run: ./tool/bootstrap_android.sh

      - name: Baixar modelo TensorFlow Lite
        run: ./tool/fetch_model.sh

      - name: Dependencias
        run: flutter pub get

      - name: Verificacao preventiva
        run: ./tool/verify_project.sh

      - name: Analise estatica
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded --coverage

      - name: Salvar cobertura de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vigiaia_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
